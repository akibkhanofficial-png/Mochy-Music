name: Auto-sync Mochy and build Melody Sterm

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream into Melody Sterm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Melody Sterm branch
        uses: actions/checkout@v5
        with:
          ref: custom-sound-tuning
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge latest Mochy source safely
        run: |
          git remote add upstream https://github.com/realidkroo/Mochy-Music.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:custom-sound-tuning

  build:
    name: Build updated Melody Sterm APK
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated Melody Sterm branch
        uses: actions/checkout@v5
        with:
          ref: custom-sound-tuning

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Restore stable signing key
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: melody-sterm-debug-keystore-v1

      - name: Generate signing key on first run only
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          ./gradlew assembleUniversalGmsDebug --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload updated APK
        uses: actions/upload-artifact@v4
        with:
          name: melody-sterm-universal-gms-debug
          path: app/build/outputs/apk/universalGms/debug/*.apk
          retention-days: 7
