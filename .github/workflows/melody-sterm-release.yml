name: Melody Sterm Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Build and attach signed universal GMS APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Restore private release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          chmod +x gradlew
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Attach APK to the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/universalGms/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "Universal GMS release APK was not produced"; exit 1; }
          gh release upload "${{ github.event.release.tag_name }}" "$APK#melody-sterm.apk" --clobber
